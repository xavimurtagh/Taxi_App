# =============================================================================
# OpenRide — Nginx Production Configuration
# Reverse proxy with SSL termination, WebSocket support, and security headers
# =============================================================================

# Run as the nginx user (default in the nginx Docker image)
user nginx;

# Auto-detect the number of CPU cores for worker processes
worker_processes auto;

# Error log level — warn is a good balance between verbosity and noise
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

# Maximum number of simultaneous connections per worker.
# Each worker can handle this many connections concurrently.
events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    # -------------------------------------------------------------------------
    # Basic settings
    # -------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Custom log format with request timing and upstream response time
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    # Timeouts — prevent slow clients from tying up connections
    keepalive_timeout     65;
    client_body_timeout   30s;
    client_header_timeout 30s;
    send_timeout          30s;

    # Request size limit — prevents excessively large uploads
    client_max_body_size 10m;

    # Hide nginx version from response headers (security)
    server_tokens off;

    # -------------------------------------------------------------------------
    # Gzip compression — reduces bandwidth for text-based responses
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/opentype
        image/svg+xml
        image/x-icon;

    # -------------------------------------------------------------------------
    # Rate limiting zones
    # -------------------------------------------------------------------------

    # General API rate limit: 30 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Auth endpoints rate limit: 5 requests per second per IP (prevent brute force)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # WebSocket connection rate limit: 10 connections per second per IP
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=10r/s;

    # Global connection limit per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # -------------------------------------------------------------------------
    # Upstream definitions
    # -------------------------------------------------------------------------

    # Backend API servers (port 3000).
    # When running multiple API replicas via Docker Compose deploy.replicas,
    # Docker's internal DNS load balances across them automatically.
    upstream api {
        least_conn;
        server api:3000;
        keepalive 32;
    }

    # Next.js web frontend (port 3001)
    upstream web {
        server web:3001;
        keepalive 16;
    }

    # -------------------------------------------------------------------------
    # HTTP -> HTTPS redirect
    # -------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Allow Let's Encrypt ACME challenge for certificate validation
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Nginx internal health check (used by Docker healthcheck)
        location /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # HTTPS server — main configuration
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # -----------------------------------------------------------------
        # SSL configuration
        # -----------------------------------------------------------------
        # Paths for Let's Encrypt certificates.
        # These are populated by certbot (see init-letsencrypt.sh).
        # Replace 'openride.community' with your actual domain.
        ssl_certificate     /etc/letsencrypt/live/openride.community/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/openride.community/privkey.pem;

        # SSL parameters — modern configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # OCSP stapling for faster TLS handshakes
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # -----------------------------------------------------------------
        # Security headers
        # -----------------------------------------------------------------
        # HSTS — force HTTPS for 2 years, include subdomains
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Prevent clickjacking — deny framing from other origins
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Prevent MIME type sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # XSS protection (legacy browsers)
        add_header X-XSS-Protection "1; mode=block" always;

        # Referrer policy — send origin only for cross-origin requests
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Permissions policy — restrict browser features
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self)" always;

        # Content Security Policy — restrict resource loading
        # Adjust as needed for your frontend assets and third-party services
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'self';" always;

        # -----------------------------------------------------------------
        # Connection limits
        # -----------------------------------------------------------------
        limit_conn conn_limit 100;

        # -----------------------------------------------------------------
        # API routes — proxy to backend
        # -----------------------------------------------------------------

        # Health check endpoint (no rate limiting)
        location /health {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # No rate limiting on health checks
            access_log off;
        }

        # API v1 routes
        location /api/v1/ {
            # Rate limiting: allow bursts of up to 20 requests
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts for API calls
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # Auth endpoints — stricter rate limiting to prevent brute-force
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # -----------------------------------------------------------------
        # WebSocket — Socket.IO endpoint
        # -----------------------------------------------------------------
        location /socket.io/ {
            limit_req zone=ws_limit burst=5 nodelay;

            proxy_pass http://api;
            proxy_http_version 1.1;

            # These headers are required for the WebSocket upgrade handshake
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket connections can be long-lived
            proxy_read_timeout    86400s;
            proxy_send_timeout    86400s;
            proxy_connect_timeout 10s;
        }

        # -----------------------------------------------------------------
        # Static asset caching for Next.js
        # -----------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Static assets are content-hashed, so they can be cached aggressively
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # -----------------------------------------------------------------
        # Next.js web frontend — catch-all for everything else
        # -----------------------------------------------------------------
        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # -----------------------------------------------------------------
        # ACME challenge for certificate renewal
        # -----------------------------------------------------------------
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # -----------------------------------------------------------------
        # Deny access to hidden files (except .well-known)
        # -----------------------------------------------------------------
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
