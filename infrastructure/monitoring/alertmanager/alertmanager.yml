global:
  # How long to wait before sending a notification about new alerts
  # that are added to a group of alerts for which an initial
  # notification has already been sent.
  resolve_timeout: 5m

  # SMTP configuration (placeholder — replace with real values)
  smtp_smarthost: "smtp.example.com:587"
  smtp_from: "alerts@openride.community"
  smtp_auth_username: "alerts@openride.community"
  smtp_auth_password: "<SMTP_PASSWORD>"
  smtp_require_tls: true

# Templates for notification messages
templates:
  - "/etc/alertmanager/templates/*.tmpl"

# The root route — all alerts enter here
route:
  # Group alerts by these labels
  group_by: ["alertname", "severity"]

  # How long to wait to buffer alerts of the same group before sending
  group_wait: 30s

  # How long to wait before sending a notification about new alerts
  # added to a group for which an initial notification has been sent
  group_interval: 5m

  # How long to wait before re-sending a notification
  repeat_interval: 4h

  # Default receiver
  receiver: "slack-and-email"

  # Child routes for severity-based routing
  routes:
    - match:
        severity: critical
      receiver: "slack-and-email"
      repeat_interval: 1h
      continue: false

    - match:
        severity: warning
      receiver: "slack-warnings"
      repeat_interval: 4h
      continue: false

# Notification receivers
receivers:
  - name: "slack-and-email"
    slack_configs:
      - api_url: "<SLACK_WEBHOOK_URL>"
        channel: "#openride-alerts"
        title: '{{ template "slack.default.title" . }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Severity:* {{ .Labels.severity }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

    email_configs:
      - to: "oncall@openride.community"
        send_resolved: true
        headers:
          Subject: '[OpenRide {{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'

  - name: "slack-warnings"
    slack_configs:
      - api_url: "<SLACK_WEBHOOK_URL>"
        channel: "#openride-warnings"
        title: '{{ template "slack.default.title" . }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        send_resolved: true
        color: "warning"

# Inhibition rules — suppress lower-severity duplicates
inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]
