global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load alert rules
rule_files:
  - "alert-rules.yml"

# Scrape configurations
scrape_configs:
  # ---------------------------------------------------------------------------
  # OpenRide API server
  # ---------------------------------------------------------------------------
  - job_name: "openride-api"
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
          - "openride-api:3000"
        labels:
          service: "openride-api"
          environment: "production"

  # ---------------------------------------------------------------------------
  # Prometheus self-monitoring
  # ---------------------------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  # ---------------------------------------------------------------------------
  # Node Exporter (optional host metrics)
  # ---------------------------------------------------------------------------
  - job_name: "node-exporter"
    scrape_interval: 30s
    static_configs:
      - targets:
          - "node-exporter:9100"
        labels:
          service: "node-exporter"
