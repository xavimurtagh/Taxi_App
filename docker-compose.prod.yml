# =============================================================================
# OpenRide — Production Docker Compose
# =============================================================================
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Prerequisites:
#   1. Copy .env.production.example to .env.production and fill in real values
#   2. Run infrastructure/ssl/init-letsencrypt.sh to set up SSL certificates
#   3. Ensure DNS A record points to this server
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # API — Node.js/Express backend
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/openride/openride-api:${IMAGE_TAG:-latest}
    restart: always
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        tag: "openride-api"

  # ---------------------------------------------------------------------------
  # Web — Next.js frontend
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: ghcr.io/openride/openride-web:${IMAGE_TAG:-latest}
    restart: always
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - frontend
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/').then(r => { if (r.status >= 500) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "openride-web"

  # ---------------------------------------------------------------------------
  # PostgreSQL + PostGIS — primary database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openride}
      POSTGRES_USER: ${POSTGRES_USER:-openride}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      # Performance tuning via PG env vars
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=en_US.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # PostgreSQL performance tuning via command-line flags.
    # These are conservative defaults for a 4GB RAM server. Adjust based
    # on your actual hardware.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=3GB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "log_temp_files=0"
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openride} -d ${POSTGRES_DB:-openride}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        tag: "openride-postgres"

  # ---------------------------------------------------------------------------
  # Redis — caching, session store, Socket.IO adapter
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: always
    # Redis configuration:
    #   --requirepass       : password authentication
    #   --appendonly yes    : AOF persistence for durability
    #   --maxmemory         : memory limit
    #   --maxmemory-policy  : evict least-recently-used keys when memory is full
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
        --appendonly yes
        --appendfsync everysec
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --tcp-backlog 511
        --timeout 300
        --tcp-keepalive 60
        --loglevel notice
    volumes:
      - redisdata:/data
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
        tag: "openride-redis"

  # ---------------------------------------------------------------------------
  # Nginx — reverse proxy, SSL termination, load balancer
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: ./infrastructure/nginx
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/ssl/certbot/conf:/etc/letsencrypt:ro
      - ./infrastructure/ssl/certbot/www:/var/www/certbot:ro
    depends_on:
      - api
      - web
    networks:
      - frontend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        tag: "openride-nginx"

  # ---------------------------------------------------------------------------
  # Certbot — automatic SSL certificate renewal
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./infrastructure/ssl/certbot/conf:/etc/letsencrypt
      - ./infrastructure/ssl/certbot/www:/var/www/certbot
    # Check for certificate renewal every 12 hours.
    # Certbot only renews if the certificate is within 30 days of expiry.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    networks: []
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
        tag: "openride-certbot"

  # ---------------------------------------------------------------------------
  # Backup — automated database backups
  # ---------------------------------------------------------------------------
  backup:
    build:
      context: ./infrastructure/backup
      dockerfile: Dockerfile
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-openride}
      POSTGRES_USER: ${POSTGRES_USER:-openride}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      S3_BACKUP_PREFIX: ${S3_BACKUP_PREFIX:-openride/db-backups}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      WEBHOOK_URL: ${BACKUP_WEBHOOK_URL:-}
    volumes:
      - backupdata:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
        tag: "openride-backup"

# =============================================================================
# Networks
# =============================================================================
# Two separate networks for security:
#   - frontend: nginx <-> api, nginx <-> web (publicly reachable services)
#   - backend:  api <-> postgres, api <-> redis, backup <-> postgres
# This ensures the database and Redis are NOT directly accessible from nginx
# or any publicly exposed network.
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

# =============================================================================
# Volumes — persistent data storage
# =============================================================================
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  backupdata:
    driver: local
